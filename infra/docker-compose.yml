# Local test stack: the app plus a SQLite file in a named volume. Not a production setup.
# Started by setups/setup-*-with-docker.sh, which creates the root .env this file reads its secrets from:
#   docker compose -f infra/docker-compose.yml --env-file .env up -d --build
name: links-afiliados
services:
  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      # Always the file in the volume: the container never talks to a remote database, whatever .env says.
      TURSO_DATABASE_URL: file:/data/local.db
      BETTER_AUTH_URL: http://localhost:${APP_PORT:-3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?missing in .env - run a setups/setup-*-with-docker.sh script}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?missing in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?missing in .env}
      CRON_SECRET: ${CRON_SECRET:?missing in .env - run a setups/setup-*-with-docker.sh script}
      LINKS_API_KEY: ${LINKS_API_KEY:?missing in .env - run a setups/setup-*-with-docker.sh script}
      # The Telegram variables are left out on purpose: a test stack must not post to the real channel.
    volumes:
      - data:/data
volumes:
  data:
