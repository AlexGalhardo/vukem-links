name: CI

# Manual trigger only while GitHub Actions billing is unresolved: the same gate runs in .husky/pre-push.
# To enable: replace `workflow_dispatch` with `push: { branches: [main] }` and `pull_request`.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run ci
